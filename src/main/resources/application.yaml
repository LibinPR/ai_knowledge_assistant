spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: ai-knowledge-assistant

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

    
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  tomcat:
    threads:
      max: 5
      min-spare: 2

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 604800
    issuer: "ai-knowledge-assistant"

groq:
  api-key: ${GROQ_API_KEY}
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
  model: ${GROQ_MODEL:openai/gpt-oss-20b}

embedding:
  server:
    url: ${HF_BASE_URL:http://localhost:8081/embed}

logging:
  level:
    root: INFO
    com.yourorg: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
