services:

  db:
    image: pgvector/pgvector:pg16
    container_name: ai_knowledge_db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ai_knowledge_assistant
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: embedder
    ports:
      - "8081:80"
    command: --model-id BAAI/bge-small-en-v1.5
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    
  app:
    build: .
    container_name: ai-knowledge-assistant
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/ai_knowledge_assistant
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_BASE_URL: https://api.groq.com/openai/v1
      GROQ_MODEL: llama-3.1-8b-instant
      SPRING_PROFILES_ACTIVE: prod
      HF_BASE_URL: http://embedder:80/embed
    depends_on:
      db:
        condition: service_healthy
      embedder:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata: